# Colcon settings for the orchestrator container.
#
# Two jobs. Generated files stay inside the container, outside the /workspace
# bind mount, so a build never writes into the repository. And a bare
# `colcon build` or `colcon test` touches only the packages this container
# owns - the one source tree also holds the vision packages and the driver,
# whose dependencies are deliberately not installed here.
"":
  log-base: /opt/colcon_ws/log
build:
  base-paths: [/workspace/src]
  build-base: /opt/colcon_ws/build
  install-base: /opt/colcon_ws/install
  # No build type by default means no debug symbols. The compile commands are
  # what clangd reads.
  cmake-args: [-DCMAKE_BUILD_TYPE=RelWithDebInfo, -DCMAKE_EXPORT_COMPILE_COMMANDS=ON]
  packages-select: [btcpp_ros2_interfaces, behaviortree_ros2, robot_control_msgs,
                    tvarometr_interfaces, tvarometr_orchestrator]
test:
  base-paths: [/workspace/src]
  build-base: /opt/colcon_ws/build
  install-base: /opt/colcon_ws/install
  packages-select: [btcpp_ros2_interfaces, behaviortree_ros2, robot_control_msgs,
                    tvarometr_interfaces, tvarometr_orchestrator]
test-result:
  test-result-base: /opt/colcon_ws/build
