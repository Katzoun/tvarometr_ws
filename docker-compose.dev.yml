# Development stack. Three environments over one source tree:
#
#   orchestrator  the behaviour tree, CPU only - started by a plain `up -d`
#   inference     camera and networks, wants an NVIDIA GPU  (--profile inference)
#   driver        the ABB driver, wants a robot             (--profile robot)
#
# Only the first two are developed here. The driver has its own repository and
# this builds its production image - we run the driver, we do not define its
# environment. See README.md for the workflow.

services:
  orchestrator:
    build:
      context: .
      dockerfile: docker/orchestrator.Dockerfile
    image: tvarometr/orchestrator:dev
    container_name: tvarometr_orchestrator_dev
    network_mode: host
    # Fast DDS talks over shared memory; with a private /dev/shm other nodes
    # discover this one but no messages arrive.
    ipc: host
    stdin_open: true
    tty: true
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    # One set of files seen from two places, so there is nothing to copy back
    # out. Colcon writes outside it, to /opt/colcon_ws, and not to a volume.
    volumes:
      - .:/workspace
      # Editor extensions and assistant logins - expensive to reinstall, and
      # otherwise thrown away with the container on every rebuild.
      - orchestrator-vscode-server:/root/.vscode-server
      - claude-home:/root/.claude
      - codex-home:/root/.codex
    command: sleep infinity

  inference:
    # Wants an NVIDIA GPU, so a plain `up -d` leaves it alone.
    profiles: [inference]
    build:
      context: .
      dockerfile: docker/inference.Dockerfile
    image: tvarometr/inference:dev
    container_name: tvarometr_inference_dev
    network_mode: host
    # Fast DDS talks over shared memory; with a private /dev/shm other nodes
    # discover this one but no messages arrive.
    ipc: host
    stdin_open: true
    tty: true
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      PYTHONUNBUFFERED: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # GUI tools draw on the host display. Host networking already shares the X
      # socket; the host has to allow it with `xhost +SI:localuser:root`.
      DISPLAY: ${DISPLAY:-:0}
    devices:
      # The container will not start without this device. On a machine with no
      # webcam, set CAMERA_DEVICE=/dev/null and launch with use_camera:=false.
      - ${CAMERA_DEVICE:-/dev/video0}:/dev/video0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - .:/workspace
      - ./models:/opt/tvarometr/models:ro
      - inference-vscode-server:/root/.vscode-server
      - claude-home:/root/.claude
      - codex-home:/root/.codex
    command: sleep infinity

  driver:
    # Wants a robot, so a plain `up -d` leaves it alone.
    profiles: [robot]
    # Built from the driver's own Dockerfile, against the source that
    # `vcs import src < driver.repos` puts in place. Nothing about the driver's
    # environment is described here.
    build:
      context: ./src/abb_rws2_ros2_driver
      dockerfile: docker/prod.Dockerfile
    image: abb_rws2_ros2_driver:prod
    container_name: abb_rws2_ros2_driver
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      PYTHONUNBUFFERED: "1"

volumes:
  claude-home:
  codex-home:
  orchestrator-vscode-server:
  inference-vscode-server:
