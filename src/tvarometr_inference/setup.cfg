[develop]
script_dir=$base/lib/tvarometr_inference
[install]
install_scripts=$base/lib/tvarometr_inference

[tool:pytest]
# MiVOLO and ResEmoteNet are vendored whole and import torch at module level.
# Without this pytest walks into them while collecting and the run dies before
# it reaches our own tests.
norecursedirs = tvarometr_inference/vendor
