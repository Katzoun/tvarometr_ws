# Inference node parameters, read at start: edit, then restart the launch.

inference_node:
  ros__parameters:

    # Without CUDA the node warns and falls back to the CPU, which is slow.
    device: cuda:0

    # The inference container mounts the repo's models/ here.
    models_dir: /opt/tvarometr/models

    # Any single model can come from elsewhere, e.g. to try a new checkpoint.
    # detector_path: /opt/tvarometr/models/yolov8x_person_face.pt
    # mivolo_path: /opt/tvarometr/models/model_imdb_cross_person_4.22_99.46.pth.tar
    # resemotenet_path: /opt/tvarometr/models/ResEmoteNetBS64.pth

    # The camera node's JPEGs; only the frames the node analyses get decoded.
    image_topic: /image_raw/compressed

    # The visitor is the widest person near the axis; anyone narrower is too far.
    min_person_width_px: 300
    # Axis over the floor mark as a fraction of the width; axis_falloff away counts
    # half, 0.0 ignores it. Keep the decimal points, or the node will not start.
    axis_x: 0.5
    axis_falloff: 0.25
    # Warn when the runner-up scores at least this fraction of the winner.
    ambiguity_ratio: 0.8
    # The emotion model sees a square around the face, this much of it added per side.
    emotion_margin: 0.3
    # How long DetectFace waits for a frame taken after the robot stopped.
    fresh_frame_timeout_s: 2.0

    # RunInference averages the visitor's face over this many frames, and fails
    # with fewer than min_samples by sample_timeout_s.
    samples: 10
    min_samples: 5
    sample_timeout_s: 5.0

    # scene_image (the TV) and debug_image, as JPEG on every analysed frame while
    # watched. Age, gender and emotion only for debug_image and while collecting.
    jpeg_quality: 80
