# Parameters for the inference node.
#
# Read once, when the node starts: edit the value, then restart the launch.
# Change the key below if you rename the node.

inference_node:
  ros__parameters:

    # cuda:0 on the machines we run on. Asking for CUDA where there is none is
    # not fatal - the node warns and falls back to the CPU, which is slow.
    device: cuda:0

    # Where the weights live. The inference container mounts the repo's models/
    # here; outside the container, point it at that directory instead.
    models_dir: /opt/tvarometr/models

    # Each model can also be taken from somewhere else on its own, which is
    # handy for trying a single new checkpoint. Unset, they come from models_dir.
    # detector_path: /opt/tvarometr/models/yolov8x_person_face.pt
    # mivolo_path: /opt/tvarometr/models/model_imdb_cross_person_4.22_99.46.pth.tar
    # resemotenet_path: /opt/tvarometr/models/affectnet7_model.pth

    # The camera node's JPEGs; only the frames the node analyses get decoded.
    image_topic: /image_raw/compressed

    # The visitor is the widest person near the axis - width, because somebody
    # standing close is cut off by the top or the bottom of the frame long before
    # they are narrow. Narrower than this, they are too far away to be the visitor.
    min_person_width_px: 300
    # Vertical line over the floor mark, as a fraction of the image width (0.5 = centre).
    # Somebody axis_falloff from it counts half their width; 0.0 ignores the axis.
    # Keep the decimal point: an integer here stops the node from starting.
    axis_x: 0.5
    axis_falloff: 0.25
    # Warn when the runner-up scores at least this fraction of the winner.
    ambiguity_ratio: 0.8
    # How long DetectFace waits for a frame taken after the robot stopped.
    fresh_frame_timeout_s: 2.0

    # RunInference averages the visitor's face over this many frames, and fails
    # with fewer than min_samples by sample_timeout_s.
    samples: 10
    min_samples: 5
    sample_timeout_s: 5.0

    # scene_image (the TV) and debug_image, as JPEG on every analysed frame while
    # watched. Age, gender and emotion only for debug_image and while collecting.
    jpeg_quality: 80
