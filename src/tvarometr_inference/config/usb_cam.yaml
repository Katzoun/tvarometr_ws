/**:
  ros__parameters:
    video_device: "/dev/video0"

    # 1280x720 at 30 fps over MJPEG. Plain YUYV usually caps out around 10 fps at
    # this resolution on cheap webcams, which makes the preview feel laggy.
    image_width: 1280
    image_height: 720
    framerate: 30.0
    pixel_format: "mjpeg2rgb"

    camera_name: "tvarometr_cam"
    frame_id: "camera"

    # Leave the automatics on - the lighting at an event hall is nothing like
    # what we would tune fixed values for.
    autoexposure: true
    autofocus: true
    auto_white_balance: true
