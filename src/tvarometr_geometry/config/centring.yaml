/**:
  ros__parameters:
    detect_service: /inference_node/detect_face
    motion_action: /robot_controller/robot_robtarget_move

    # Camera Z limits in the goal's wobj, metres; a photo pose outside is refused.
    min_z: 0.5
    max_z: 1.3

    # Where the face centre belongs and how far off still counts as centred, as
    # fractions of the image height.
    target_y: 0.4
    tolerance: 0.05

    # Share of the error corrected per step, and the longest step in metres.
    gain: 0.7
    max_step: 0.1

    # Give up after this many steps, seconds, or useless detections in a row.
    max_steps: 15
    timeout_s: 30.0
    max_lost_detections: 3
    # Includes the detector's wait for a frame taken after the robot stopped.
    detect_timeout_s: 5.0

    # Real face height in metres, the pixel scale for a move. Assumes wobj Z up.
    face_height_m: 0.22

    # TCP speed in mm/s, as text.
    speed: "100"

    # Log every move without sending it to the robot.
    dry_run: false
