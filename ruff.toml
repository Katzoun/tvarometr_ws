# Ruff for this workspace: `ruff format .` for layout, `ruff check .` for problems.

# Code only; comments and docstrings are held by W505 below.
line-length = 88

# ROS 2 Humble ships Python 3.10.
target-version = "py310"

# Vendored as they came; git-ignored repositories are skipped anyway.
extend-exclude = [
    "src/tvarometr_inference/tvarometr_inference/vendor",
]

[lint]
# I sorts imports, W505 limits prose. No E501: long log strings the formatter
# cannot break would bury the real findings.
extend-select = ["I", "W505"]

ignore = [
    # The driver catches Exception at its boundaries, so a lost session never kills it.
    "BLE001",
]

[lint.pycodestyle]
# Same as line-length. Nothing rewraps prose; ruff points at it, you reflow it.
max-doc-length = 88

[lint.isort]
# Must agree with format.skip-magic-trailing-comma below.
split-on-trailing-comma = false
known-first-party = [
    "robot_control",
    "robot_control_msgs",
    "tvarometr_geometry",
    "tvarometr_inference",
    "tvarometr_interfaces",
]

[format]
# Whatever fits goes back on one line, trailing comma or not. To keep something
# split on purpose, put a comment in it.
skip-magic-trailing-comma = true
